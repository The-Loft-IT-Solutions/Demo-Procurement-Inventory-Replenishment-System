<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Page not found - Procurement & Inventory System</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#dde2e8;--text:#1d2733;--muted:#566474;--accent:#2f4a6b;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12171d;--card:#1a212a;--line:#2a3441;--text:#e8edf2;--muted:#a3afbd;--accent:#8fb0d6;--on:#10161d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px 24px;text-align:center}
.code{font-size:56px;font-weight:700;line-height:1;color:var(--accent);margin:0}
h1{font-size:22px;margin:12px 0 8px}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:8px;background:var(--accent);color:var(--on);text-decoration:none;font:inherit}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
small{display:block;margin-top:24px;color:var(--muted);font-size:13px}
</style></head><body><main>
<p class="code">404</p>
<h1>Page not found</h1>
<p>The page you are looking for does not exist in this demo.</p>
<a href="/">Back to the demo</a>
<small>This is a demonstration site with sample data only.</small>
</main></body></html>
